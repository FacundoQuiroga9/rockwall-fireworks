<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rockwall sky performance audit</title>
<style>body{margin:0;background:#eee;font:15px system-ui;color:#142039}header{padding:12px;position:sticky;top:0;background:#eee;z-index:2}button,label{margin:5px}button{padding:9px}pre{white-space:pre-wrap;padding:12px}.stage{height:600px;position:relative;background:#00051e;overflow:hidden}.host,.host canvas,.static{position:absolute;inset:0;width:100%;height:100%}.static{object-fit:cover}.city{position:absolute;bottom:0;left:12%;width:100%}.spacer{height:100vh}.stage.hidden{display:none}</style>
<header><strong>Local audit · actual renderer, simulated input policy</strong><br>
<label><input type="checkbox" id="touch">Simulate coarse pointer (tablet / landscape phone)</label>
<label><input type="checkbox" id="reduced">Simulate reduced motion policy</label><br>
<button id="measure">Measure 10 seconds</button><button id="pause">Pause</button><button id="hide">Hide stage</button><button id="destroy">Destroy</button><button id="mount">Mount</button>
<a href="#below">Scroll out of view</a><output id="state"></output></header>
<div class="stage" id="stage"><img class="static" id="static" src="/images/hero/sky-static-wide.svg" alt="Static celebration sky"><div class="host" id="host"></div><img class="city" src="/images/hero/dallas-skyline-1440.webp" alt="Approved Dallas skyline"></div>
<pre id="results">Ready. No CPU or network throttling. JavaScript callback timing excludes GPU/raster work.</pre><div class="spacer"></div><p id="below">Sky is outside viewport. <a href="#stage">Return to sky</a></p>
